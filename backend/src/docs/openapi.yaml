openapi: 3.1.0
info:
  title: IELTStudy API
  version: 0.3.0
  description: |
    REST API for IELTStudy, an adaptive IELTS learning platform (see `specs.md`).
    Contract-first: add or change an endpoint here in the same change as its code.

    **Auth.** Send `Authorization: Bearer <token>`, using the token from `/auth/register` or `/auth/login`.
    Tokens last 1 day. Every endpoint needs a token unless it says otherwise.

    **Roles.** Each endpoint says who may call it: learner, instructor, admin.
    "Owner" means the instructor who created the resource. Admins act only where an endpoint lists them:
    they review and archive courses and edit passages, questions and quizzes, but they don't edit or submit an instructor's course or lessons.

    **Locked content.** Content inside a course (lessons, passages, quizzes, and the questions those quizzes use)
    can only change while the course is `draft` or `rejected`. To change an approved course, the owner withdraws it first.
    Questions learners have answered and quizzes they have attempted can't be edited or deleted at all, so past grades
    and the response logs that BKT learns from stay consistent. Both rules return 409.

    **Responses.** Success: `{ <resource>, message }`. Errors: `{ error: { message, details? } }`.
    - 400: invalid input
    - 401: no token, or a bad or expired token
    - 403: wrong role, or not the owner
    - 404: not found, or not visible to you
    - 409: the request conflicts with the current state

    **Paging.** List endpoints that take `page` and `pageSize` return one page of rows plus
    `{ page, pageSize, total, totalPages }` next to the list (`PageMeta`). `pageSize` defaults to 20 and is at most 100 (400 above that).
    A page past the end is an empty list, not an error.

    **BKT.** Mastery, recommendations and lesson gating run inside this API (formerly the separate `advanced/` service).
    Submitting an attempt updates the learner's mastery and recommendations in the same transaction.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Register and log in. These are the only public endpoints.
  - name: Profile
    description: The logged-in user.
  - name: Admin
    description: User roles and access, the course review queue, usage statistics.
  - name: Skills
    description: The micro-skill taxonomy used for tagging and mastery.
  - name: Courses
    description: Course catalog, instructor authoring and the review flow (draft → pending_review → approved | rejected).
  - name: Lessons
    description: Lessons inside a course, and learner progress.
  - name: Content
    description: Reading passages, listening audio and video, and file uploads to Supabase Storage.
  - name: Questions
    description: The instructor question bank, tagged with skills (the Q-matrix).
  - name: Quizzes
    description: Lesson quizzes, practice quizzes and the 30-question diagnostic.
  - name: Attempts
    description: Taking a quiz, submitting answers and reviewing the result.
  - name: Dashboard
    description: Learner progress, skill mastery and recommendations.
  - name: Grading
    description: Instructors review submitted attempts, write feedback and follow their learners.
  - name: Discussion
    description: Comments and one level of replies under each lesson.
  - name: Notifications
    description: In-app notifications for every role.
  - name: Reports
    description: Reporting inappropriate content, and the admin moderation queue.

paths:
  # ---------------------------------------------------------------------------
  # Auth and profile
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a learner account
      description: Always creates a **learner**. Admins promote instructors with `PATCH /admin/users/{userId}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Account created and logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in
      description: |
        A wrong password and an unknown email both return the same 401, so the API never reveals which emails exist.
        A deactivated account gets 403. Rate limited (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get my profile
      description: |
        Roles: learner, instructor, admin. Every protected endpoint reloads the user from the database,
        so a deactivated account's token gets 401 at once, and a role change applies to the next request.
      responses:
        "200":
          description: The logged-in user
          content:
            application/json:
              schema:
                type: object
                required: [user, message]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update my name or target band
      description: "Roles: learner, instructor, admin. Onboarding sets `targetBand` here."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required: [user, message]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Ask for a password reset link
      description: |
        Always answers 200 with the same message, whether or not the email has an account, so it can't be used to find out who is registered.
        If an active account has this email, a single-use link valid for 30 minutes is emailed to it
        (in development the link is only written to the server log). Asking again invalidates the previous links.
        Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordInput" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: |
        `token` comes from the emailed link (`/reset-password?token=...`). A token works once and for 30 minutes.
        An unknown, used or expired token gets 400. On success every other reset token of the user is cancelled,
        and every login token issued before the change stops working (401), so other sessions are logged out.
        Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordInput" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------------------
  # Admin
  # ---------------------------------------------------------------------------
  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users
      description: "Roles: admin. Newest account first. `q` matches the email or the full name (case-insensitive)."
      parameters:
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/UserRole" }
        - name: isActive
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of users matching the filters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [users, message]
                    properties:
                      users:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
                      message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Admin]
      operationId: updateUserAccess
      summary: Change a user's role or deactivate them
      description: |
        Roles: admin. A deactivated user can't log in, and their existing token stops working at once.
        Every change is written to the audit log (`user.role_change`, `user.deactivate`, `user.activate`) in the same transaction.
        Admins can't use this on their own account (409), even for a change that does nothing. Only an admin can demote an admin, so there is always at least one admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user, message]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/courses:
    get:
      tags: [Admin]
      operationId: listAllCourses
      summary: List all courses (the review queue)
      description: |
        Roles: admin. Use `?status=pending_review` for the courses waiting for review. With `status`, the oldest submission comes first;
        without it, newest course first. `q` matches the title, the description or a lesson title (case-insensitive).
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CourseStatus" }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of courses matching the filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedCourseList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/stats:
    get:
      tags: [Admin]
      operationId: getStats
      summary: Platform usage, completion and learning statistics
      description: |
        Roles: admin. Usage counts, course completion (per approved course and on average) and learning results
        (average score of completed attempts, average BKT mastery per skill and per category).
      responses:
        "200":
          description: Current statistics
          content:
            application/json:
              schema:
                type: object
                required: [stats, message]
                properties:
                  stats: { $ref: "#/components/schemas/AdminStats" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/audit:
    get:
      tags: [Admin]
      operationId: listAuditLog
      summary: The admin audit log
      description: |
        Roles: admin. Who did what, newest first, at most the 500 newest matching entries.
        Recorded actions: `user.role_change`, `user.deactivate`, `user.activate`, `course.approve`, `course.reject`, `course.archive`,
        `report.resolve`, `report.dismiss`, `comment.remove`. Each entry is written in the same transaction as the change it records.
      parameters:
        - name: action
          in: query
          schema: { type: string, maxLength: 64 }
        - name: actorId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Audit entries matching the filters
          content:
            application/json:
              schema:
                type: object
                required: [entries, message]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: The moderation queue
      description: "Roles: admin. Open reports oldest first (the queue); with another status, newest first."
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReportStatus" }
        - name: targetType
          in: query
          schema: { $ref: "#/components/schemas/ReportTargetType" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [reports, message]
                    properties:
                      reports:
                        type: array
                        items: { $ref: "#/components/schemas/Report" }
                      message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    patch:
      tags: [Reports]
      operationId: handleReport
      summary: Resolve or dismiss a report
      description: |
        Roles: admin. Only an `open` report can be handled (409 otherwise).
        With `removeComment: true` on a comment report, the comment is removed (shown as "removed by a moderator").
        The reporter gets a notification, and the decision is written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportUpdate" }
      responses:
        "200":
          description: The handled report
          content:
            application/json:
              schema:
                type: object
                required: [report, message]
                properties:
                  report: { $ref: "#/components/schemas/Report" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------------------
  # Skills
  # ---------------------------------------------------------------------------
  /skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List the skill taxonomy
      description: "Roles: learner, instructor, admin. Read-only: `skillCode` is the fixed key the BKT parameters use."
      parameters:
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/SkillCategory" }
      responses:
        "200":
          description: All skills, or the skills in one category
          content:
            application/json:
              schema:
                type: object
                required: [skills, message]
                properties:
                  skills:
                    type: array
                    items: { $ref: "#/components/schemas/Skill" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------------------
  # Courses
  # ---------------------------------------------------------------------------
  /courses:
    get:
      tags: [Courses]
      operationId: listCatalog
      summary: The course catalog (approved courses)
      description: |
        Roles: learner, instructor, admin. `isEnrolled` tells a learner whether they are enrolled.
        Oldest course first. `q` matches the title, the description or a lesson title (case-insensitive).
      parameters:
        - name: level
          in: query
          schema: { $ref: "#/components/schemas/CourseLevel" }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of approved courses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedCourseList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Create a course (as a draft)
      description: "Roles: instructor."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Draft course created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /instructor/courses:
    get:
      tags: [Courses]
      operationId: listMyCourses
      summary: My courses, in every status
      description: "Roles: instructor. Includes `reviewFeedback` from the last review."
      responses:
        "200":
          description: Courses I teach
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /instructor/submissions:
    get:
      tags: [Grading]
      operationId: listSubmissions
      summary: Submitted attempts on my quizzes
      description: |
        Roles: instructor. Completed attempts on quizzes in courses I own (any status), newest first, each with my feedback if I wrote one.
        `courseId` and `quizId` narrow the list; a course or quiz that isn't mine simply matches nothing.
      parameters:
        - name: courseId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: quizId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: object
                required: [submissions, message]
                properties:
                  submissions:
                    type: array
                    items: { $ref: "#/components/schemas/Submission" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /instructor/submissions/{attemptId}:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    get:
      tags: [Grading]
      operationId: getSubmission
      summary: One submitted attempt with every answer
      description: "Roles: instructor who owns the quiz's course (403 otherwise). An attempt that isn't submitted yet is a 404."
      responses:
        "200":
          description: The graded attempt and its submission row
          content:
            application/json:
              schema:
                type: object
                required: [result, submission, message]
                properties:
                  result: { $ref: "#/components/schemas/AttemptResult" }
                  submission: { $ref: "#/components/schemas/Submission" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /instructor/submissions/{attemptId}/feedback:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    put:
      tags: [Grading]
      operationId: saveFeedback
      summary: Write or update my feedback on an attempt
      description: |
        Roles: instructor who owns the quiz's course (403 otherwise). Creates the feedback or replaces it.
        `totalScore` overrides the automatic score (at most `maxScore`, 400 above); null keeps the automatic one.
        The learner gets a notification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "200":
          description: Saved feedback
          content:
            application/json:
              schema:
                type: object
                required: [feedback, message]
                properties:
                  feedback: { $ref: "#/components/schemas/Feedback" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /instructor/learners:
    get:
      tags: [Grading]
      operationId: listMyLearners
      summary: Learners enrolled in my courses, with their progress
      description: "Roles: instructor. One row per learner enrolled in at least one of my courses, with progress per course."
      responses:
        "200":
          description: My learners
          content:
            application/json:
              schema:
                type: object
                required: [learners, message]
                properties:
                  learners:
                    type: array
                    items: { $ref: "#/components/schemas/InstructorLearner" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get a course
      description: |
        Roles: learner, instructor, admin. Anyone can see an approved course.
        Courses in other statuses are visible only to their owner and admins (404 for everyone else).
      responses:
        "200":
          description: The course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Courses]
      operationId: updateCourse
      summary: Edit a course
      description: |
        Roles: owner. Only while the course is `draft` or `rejected` (409 otherwise).
        To change an approved course, withdraw it first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseUpdate" }
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Courses]
      operationId: deleteCourse
      summary: Delete a draft course
      description: "Roles: owner. Only a `draft` that no learner has enrolled in (409 otherwise). Archive a course that learners have used."
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /courses/{courseId}/submit:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Courses]
      operationId: submitCourse
      summary: Submit a course for review
      description: "Roles: owner. `draft` or `rejected` → `pending_review`. The course needs at least one core lesson (409 otherwise)."
      responses:
        "200":
          description: Course is waiting for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /courses/{courseId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Courses]
      operationId: withdrawCourse
      summary: Withdraw a course back to draft
      description: |
        Roles: owner. `pending_review` or `approved` → `draft`, so the course can be edited and resubmitted.
        Enrolled learners keep their enrolment but can't open lessons until the course is approved again.
      responses:
        "200":
          description: Course is a draft again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /courses/{courseId}/approve:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Courses]
      operationId: approveCourse
      summary: Approve a course
      description: |
        Roles: admin. `pending_review` → `approved`. Learners can then see and enrol in it.
        Written to the audit log (`course.approve`). The instructor gets a notification, and when the course was approved
        before and now has new lessons, every enrolled learner is notified too.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveInput" }
      responses:
        "200":
          description: Course approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /courses/{courseId}/reject:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Courses]
      operationId: rejectCourse
      summary: Reject a course with feedback
      description: |
        Roles: admin. `pending_review` → `rejected`. Feedback is required, so the instructor knows what to fix.
        Written to the audit log (`course.reject`), and the instructor gets a notification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectInput" }
      responses:
        "200":
          description: Course rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /courses/{courseId}/archive:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Courses]
      operationId: archiveCourse
      summary: Archive a course
      description: "Roles: owner, admin. Any status → `archived`. This retires a course that has learner history. An archive by an admin is written to the audit log (`course.archive`)."
      responses:
        "200":
          description: Course archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses/{courseId}/enroll:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Courses]
      operationId: enrollInCourse
      summary: Enrol in a course
      description: "Roles: learner. Approved courses only. Enrolling twice is harmless: the second call returns 200 with the existing enrolment."
      responses:
        "200":
          description: Already enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentResult" }
        "201":
          description: Enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Courses]
      operationId: leaveCourse
      summary: Leave a course
      description: "Roles: learner. Deletes the enrolment only; lesson progress and attempts are kept. 404 if the learner is not enrolled."
      responses:
        "200":
          description: Left the course
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses/{courseId}/gates:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Lessons]
      operationId: getCourseGates
      summary: Which lessons of a course I have unlocked
      description: |
        Roles: learner. Approved courses only (404 otherwise). The unlock rule: the first core lesson is always open;
        each next core lesson opens when the previous core lesson is completed OR every skill tagged on it has mastery ≥ 0.65.
        Remedial lessons are never locked.
      responses:
        "200":
          description: One gate per lesson
          content:
            application/json:
              schema:
                type: object
                required: [courseId, gates, message]
                properties:
                  courseId: { type: integer }
                  gates:
                    type: array
                    items: { $ref: "#/components/schemas/LessonGate" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Lessons
  # ---------------------------------------------------------------------------
  /courses/{courseId}/lessons:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Lessons]
      operationId: listLessons
      summary: List a course's lessons
      description: |
        Roles: learner, instructor, admin (same visibility as the course).
        Core lessons come first in `orderIndex` order, then remedial lessons.
        For learners, each lesson also has `progress` and `locked`.
      responses:
        "200":
          description: The course's lessons
          content:
            application/json:
              schema:
                type: object
                required: [lessons, message]
                properties:
                  lessons:
                    type: array
                    items: { $ref: "#/components/schemas/Lesson" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Lessons]
      operationId: createLesson
      summary: Add a lesson to a course
      description: "Roles: owner. Only while the course is `draft` or `rejected` (409 otherwise)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonInput" }
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /lessons/{lessonId}:
    parameters:
      - $ref: "#/components/parameters/LessonId"
    get:
      tags: [Lessons]
      operationId: getLesson
      summary: Open a lesson
      description: |
        Roles: learner, instructor, admin. Returns the lesson with its passages and media, quizzes and skill tags.
        A learner must be enrolled in the (approved) course, and the lesson must not be `locked` (403 otherwise).
        Exception: a `remedial` lesson of an approved course is open to every learner without enrolling, because recommendations can point to it.
      responses:
        "200":
          description: The lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Lessons]
      operationId: updateLesson
      summary: Edit a lesson
      description: "Roles: owner. Only while the course is `draft` or `rejected` (409 otherwise). `skills` replaces the whole tag list."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonUpdate" }
      responses:
        "200":
          description: Updated lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Lessons]
      operationId: deleteLesson
      summary: Delete a lesson
      description: "Roles: owner. Only while the course is `draft` or `rejected`, and only if no learner has attempted its quizzes (409 otherwise)."
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /lessons/{lessonId}/progress:
    parameters:
      - $ref: "#/components/parameters/LessonId"
    put:
      tags: [Lessons]
      operationId: setLessonProgress
      summary: Mark a lesson as started or completed
      description: "Roles: learner (enrolled). Creates or updates my progress; `completedAt` is set when the status is `completed`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressInput" }
      responses:
        "200":
          description: My progress on this lesson
          content:
            application/json:
              schema:
                type: object
                required: [progress, message]
                properties:
                  progress: { $ref: "#/components/schemas/LessonProgress" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /lessons/{lessonId}/comments:
    parameters:
      - $ref: "#/components/parameters/LessonId"
    get:
      tags: [Discussion]
      operationId: listLessonComments
      summary: The discussion under a lesson
      description: |
        Roles: anyone who may open the lesson (same rule as `GET /lessons/{lessonId}`).
        Top-level comments newest first, one page at a time, each with all its replies oldest first.
        A removed comment that has replies stays as a placeholder (`body` null); one without replies is left out.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of top-level comments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [comments, message]
                    properties:
                      comments:
                        type: array
                        items: { $ref: "#/components/schemas/Comment" }
                      message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Discussion]
      operationId: createLessonComment
      summary: Comment on a lesson, or reply to a comment
      description: |
        Roles: anyone who may open the lesson. With `parentId`, a reply to a top-level comment of the same lesson (400 for a reply to a reply,
        or a parent in another lesson; 409 if the parent was removed). The parent's author gets a notification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    patch:
      tags: [Discussion]
      operationId: updateComment
      summary: Edit my comment
      description: "Roles: the comment's author (403 otherwise). A removed comment can't be edited (404)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Discussion]
      operationId: deleteComment
      summary: Remove a comment
      description: |
        Roles: the author, the instructor who owns the lesson's course, admin (403 otherwise). The comment is soft-deleted:
        its replies stay visible under a placeholder. A removal by an admin is written to the audit log (`comment.remove`).
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports:
    post:
      tags: [Reports]
      operationId: createReport
      summary: Report inappropriate content
      description: |
        Roles: any logged-in user. `targetType` is `comment`, `lesson` or `question`; the target must exist and be visible to me (404 otherwise).
        Reporting the same target twice returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                type: object
                required: [report, message]
                properties:
                  report: { $ref: "#/components/schemas/Report" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------------------
  # Content: passages, media and uploads
  # ---------------------------------------------------------------------------
  /uploads:
    post:
      tags: [Content]
      operationId: createUpload
      summary: Get a signed URL to upload a media file
      description: |
        Roles: instructor, admin.
        1. Call this to get `uploadUrl` and `path`.
        2. `PUT` the file straight to `uploadUrl`, with the same `Content-Type`. The file never passes through this API.
        3. Create or update a passage with `mediaPath: path`.

        The Storage bucket is private: files are read only through the signed `mediaUrl` of a passage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: Signed upload URL
          content:
            application/json:
              schema:
                type: object
                required: [upload, message]
                properties:
                  upload: { $ref: "#/components/schemas/UploadTicket" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /passages:
    post:
      tags: [Content]
      operationId: createPassage
      summary: Add a reading passage, audio or video
      description: |
        Roles: instructor, admin.
        - `reading_text` needs `content`. `listening_audio` and `video` need `mediaPath` (from `/uploads`); their `content` is an optional transcript.
        - Instructors must attach the passage to a lesson of their own course while it is `draft` or `rejected`.
          Only admins may leave `lessonId` empty (passages for the diagnostic).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassageInput" }
      responses:
        "201":
          description: Passage created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassageResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /passages/{passageId}:
    parameters:
      - $ref: "#/components/parameters/PassageId"
    get:
      tags: [Content]
      operationId: getPassage
      summary: Get a passage (author view)
      description: "Roles: owner, admin. Learners see passages inside lessons and quizzes instead."
      responses:
        "200":
          description: The passage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassageResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Content]
      operationId: updatePassage
      summary: Edit a passage
      description: "Roles: owner, admin. Same course-status rule as creating one."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassageUpdate" }
      responses:
        "200":
          description: Updated passage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassageResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Content]
      operationId: deletePassage
      summary: Delete a passage
      description: |
        Roles: owner, admin. Same course-status rule as creating one.
        Deleting a passage also deletes its questions, so it fails (409) once learners have answered them.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------------------
  # Questions
  # ---------------------------------------------------------------------------
  /questions:
    get:
      tags: [Questions]
      operationId: listQuestions
      summary: Browse the question bank
      description: "Roles: instructor (my questions), admin (all questions)."
      parameters:
        - name: skillId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: passageId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/QuestionType" }
      responses:
        "200":
          description: Questions matching the filters
          content:
            application/json:
              schema:
                type: object
                required: [questions, message]
                properties:
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/Question" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Questions]
      operationId: createQuestion
      summary: Write a question and tag it with skills
      description: |
        Roles: instructor, admin.
        - `skills` is the question's row of the Q-matrix: the weights must **sum to 1** (400 otherwise). An unknown skill id is a 400.
        - `options` and `answerKey` must match `questionType`; see the `QuestionInput` schema.
        - `passageId`, if given, must be a passage I created (403 otherwise; admins may use any passage). A missing passage is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionInput" }
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /questions/{questionId}:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    get:
      tags: [Questions]
      operationId: getQuestion
      summary: Get a question (author view, with the answer)
      description: "Roles: owner, admin."
      responses:
        "200":
          description: The question
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Questions]
      operationId: updateQuestion
      summary: Edit a question
      description: |
        Roles: owner, admin. `skills` replaces the whole list, and its weights must sum to 1.
        The `options` / `answerKey` rule is checked on the question as it will be after the edit, so changing `questionType` usually needs new `options` and `answerKey` too.
        The same `passageId` rule as creating.
        Fails (409) once learners have answered the question, or while a quiz in a course that isn't `draft` or `rejected` uses it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionUpdate" }
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Questions]
      operationId: deleteQuestion
      summary: Delete a question
      description: |
        Roles: owner, admin. The same rules as editing: fails (409) once learners have answered it,
        or while a quiz in a course that isn't `draft` or `rejected` uses it.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------------------
  # Quizzes
  # ---------------------------------------------------------------------------
  /quizzes:
    post:
      tags: [Quizzes]
      operationId: createQuiz
      summary: Build a quiz from questions
      description: |
        Roles: instructor, admin.
        - `lesson` and `practice` quizzes need a `lessonId` (400 otherwise). Instructors must use a lesson of their own course (403);
          admins may use any lesson. Either way the course must be `draft` or `rejected` (409).
        - `diagnostic`: admins only (403), with no lesson (400), and there can be only one (409).
        - Only questions I created (or any question, for admins) can be used (403). An unknown question id is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizInput" }
      responses:
        "201":
          description: Quiz created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /quizzes/{quizId}:
    parameters:
      - $ref: "#/components/parameters/QuizId"
    get:
      tags: [Quizzes]
      operationId: getQuiz
      summary: Get a quiz
      description: |
        Roles: learner, instructor, admin.
        - The quiz's creator, the instructor who owns its course, and admins get the author view (questions with answers).
        - Everyone else gets the learner view (no answers, explanations or skill weights), with the same access rule as the quiz's lesson:
          learners must be enrolled in its approved course (403 otherwise; not needed for a quiz of a remedial lesson), and a course the caller can't see is a 404.
          Anyone may see the learner view of the diagnostic.
      responses:
        "200":
          description: The quiz
          content:
            application/json:
              schema:
                type: object
                required: [quiz, message]
                properties:
                  quiz:
                    oneOf:
                      - $ref: "#/components/schemas/Quiz"
                      - $ref: "#/components/schemas/QuizForLearner"
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Quizzes]
      operationId: updateQuiz
      summary: Edit a quiz
      description: |
        Roles: owner, admin. `questionIds` replaces the whole list, with the same question rules as creating a quiz.
        Fails (409) once learners have attempted the quiz, or if its course isn't `draft` or `rejected`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizUpdate" }
      responses:
        "200":
          description: Updated quiz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Quizzes]
      operationId: deleteQuiz
      summary: Delete a quiz
      description: |
        Roles: owner, admin. The same rules as editing: fails (409) once learners have attempted it,
        or if its course isn't `draft` or `rejected`.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /diagnostic:
    get:
      tags: [Quizzes]
      operationId: getDiagnostic
      summary: Get the 30-question placement test
      description: "Roles: learner. `completedAttemptId` is set once I have finished it; the diagnostic can only be taken once."
      responses:
        "200":
          description: The diagnostic quiz, learner view
          content:
            application/json:
              schema:
                type: object
                required: [quiz, completedAttemptId, message]
                properties:
                  quiz: { $ref: "#/components/schemas/QuizForLearner" }
                  completedAttemptId:
                    type: [integer, "null"]
                    description: My finished diagnostic attempt, or null if I haven't taken it.
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No diagnostic has been created yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # Attempts
  # ---------------------------------------------------------------------------
  /quizzes/{quizId}/attempts:
    parameters:
      - $ref: "#/components/parameters/QuizId"
    post:
      tags: [Attempts]
      operationId: startAttempt
      summary: Start (or resume) a quiz attempt
      description: |
        Roles: learner, with access to the quiz (the same rule as its lesson: enrolled in an approved course, unless the lesson is remedial, and the lesson unlocked).
        Any learner may take the diagnostic. Instructors and admins get 403.
        - If I already have an unfinished attempt on this quiz, it is returned (200) instead of starting a new one (201).
          Two starts at the same moment get the same attempt.
        - Time limit: if the quiz has `timeLimitSeconds` and my unfinished attempt ran out of time (plus a 30-second grace period for network delay),
          the server closes it first, grading the answers autosaved before the deadline (see `PUT /attempts/{attemptId}/answers`), and starts a new attempt (201). Not applied to the diagnostic.
        - `quiz` is the learner view: no answers.
        - 403 if I'm not enrolled in the quiz's course; 404 if the quiz doesn't exist or its course isn't visible.
        - 409 if I already completed the diagnostic, or the quiz has no questions.
      responses:
        "200":
          description: Resumed my unfinished attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartAttemptResult" }
        "201":
          description: New attempt started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartAttemptResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /attempts/{attemptId}:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    get:
      tags: [Attempts]
      operationId: getAttempt
      summary: Review an attempt
      description: |
        Roles: the learner who made it, admin. Another learner, or an instructor, gets 403.
        After submitting, this is the full graded result for the post-quiz review screen.
        Before submitting, `responses` is empty and no answers are revealed.
        If the quiz has a time limit and this unfinished attempt ran out of time (plus a 30-second grace period), the server closes it
        before answering, grading only the answers autosaved before the deadline, so it is returned as completed. Not applied to the diagnostic.
      responses:
        "200":
          description: The attempt
          content:
            application/json:
              schema:
                type: object
                required: [result, message]
                properties:
                  result: { $ref: "#/components/schemas/AttemptResult" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attempts/{attemptId}/submit:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    post:
      tags: [Attempts]
      operationId: submitAttempt
      summary: Submit my answers
      description: |
        Roles: the learner who started the attempt.
        - Send all answers at once. The array order is the order I answered in (`attemptOrder`).
        - Each `questionId` must belong to the quiz and appear at most once (400 otherwise). Questions I skip count as wrong.
        - Each answer must fit its question type: a string, or for `matching` an object of item id → choice id (400 otherwise).
        - Grading: option ids and `true`/`false`/`not_given` must match exactly; gap-fill answers match any accepted answer,
          ignoring case and extra spaces; `matching` is all or nothing (every item right, and no extra items).
        - The server grades the answers; the client never sends `isCorrect`. Grading, logging the responses, the BKT mastery update
          and the new recommendations all happen in one transaction.
        - Submitting twice returns 409.
        - Time limit: a submit after the limit plus the 30-second grace period returns 409, and the attempt is closed with the answers that
          were autosaved before the deadline. The diagnostic is exempt. An attempt that is never submitted is closed the same way the next
          time it is opened (see startAttempt and getAttempt).
        - Mastery: the diagnostic sets the starting mastery of every skill (cold start: an unmeasured skill takes the average of its category).
          Later attempts update each tagged skill per answer, weighted by the Q-matrix. `masteryChanges` shows before/after per skill.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitInput" }
      responses:
        "200":
          description: Graded result
          content:
            application/json:
              schema:
                type: object
                required: [result, message]
                properties:
                  result: { $ref: "#/components/schemas/AttemptResult" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /attempts/{attemptId}/answers:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    get:
      tags: [Attempts]
      operationId: getDraftAnswers
      summary: The answers autosaved on my open attempt
      description: |
        Roles: the learner who started the attempt. Returns what was last saved, so the quiz player can restore it after a reload
        or on another device. `remainingSeconds` is computed by the server from its own clock (null when the quiz has no time limit).
      responses:
        "200":
          description: Saved answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAnswers" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Attempts]
      operationId: saveDraftAnswers
      summary: Autosave my answers while the attempt is open
      description: |
        Roles: the learner who started the attempt. Replaces the saved set with `responses` (send every answered question each time).
        Each answer's `savedAt` is kept from the previous save when the answer didn't change, so the server knows when every answer was given.
        Answers are checked like a submit (question in the quiz, answer shape; 400 otherwise) but not graded.
        409 if the attempt is already submitted, or if its time is up (the attempt is then closed with the answers saved before the deadline).
        `remainingSeconds` from the client is accepted and ignored: the server's clock decides.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftAnswersInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [savedAt, message]
                properties:
                  savedAt: { type: string, format: date-time }
                  message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /attempts/{attemptId}/feedback:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    get:
      tags: [Attempts]
      operationId: getAttemptFeedback
      summary: The instructor's feedback on my attempt
      description: "Roles: the learner who made the attempt, admin. `feedback` is null until an instructor writes one."
      responses:
        "200":
          description: Feedback or null
          content:
            application/json:
              schema:
                type: object
                required: [feedback, message]
                properties:
                  feedback:
                    oneOf:
                      - $ref: "#/components/schemas/Feedback"
                      - type: "null"
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/attempts:
    get:
      tags: [Attempts]
      operationId: listMyAttempts
      summary: My attempt history
      description: "Roles: learner. Newest first. With `quizId`, only that quiz's attempts (an empty list if there are none); with `status`, only open or only completed ones."
      parameters:
        - name: quizId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { type: string, enum: [in_progress, completed] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of my attempts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [attempts, message]
                    properties:
                      attempts:
                        type: array
                        items: { $ref: "#/components/schemas/AttemptSummary" }
                      message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  /me/enrollments:
    get:
      tags: [Dashboard]
      operationId: listMyEnrollments
      summary: My courses and progress
      description: "Roles: learner."
      responses:
        "200":
          description: My enrolments with progress
          content:
            application/json:
              schema:
                type: object
                required: [enrollments, message]
                properties:
                  enrollments:
                    type: array
                    items: { $ref: "#/components/schemas/Enrollment" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/mastery:
    get:
      tags: [Dashboard]
      operationId: getMyMastery
      summary: My skill mastery (radar chart)
      description: "Roles: learner. One entry per skill I have evidence for; empty until I finish the diagnostic."
      responses:
        "200":
          description: My mastery per skill
          content:
            application/json:
              schema:
                type: object
                required: [mastery, message]
                properties:
                  mastery:
                    type: array
                    items: { $ref: "#/components/schemas/Mastery" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /recommendations:
    get:
      tags: [Dashboard]
      operationId: getRecommendations
      summary: My next best steps
      description: |
        Roles: learner. Up to 3 lessons for skills whose mastery is below 0.65, each with a human-readable rationale.
        Target: p95 latency under 300 ms. The newest batch is returned while it still applies; otherwise a new batch is generated.

        Ranking (for each unlocked lesson tagged with at least one weak skill; core lessons only from courses I'm enrolled in,
        remedial lessons from any approved course):
        `score = 0.50·cos(need, lesson tags) + 0.25·(0.65 − mastery)/0.65 + kind bonus (remedial 0.20, core 0.05)
        + 0.10 if the course level fits my target band + 0.08 if enrolled + 0.12 if the skill was in the quiz just taken − 0.35 if already completed`,
        where `need` is each weak skill's gap below 0.65 (×1.25 for skills in the quiz just taken). The top 3 are picked greedily,
        with −0.15 for a skill already picked, so the list covers different skills.
      responses:
        "200":
          description: Ranked recommendations
          content:
            application/json:
              schema:
                type: object
                required: [recommendations, message]
                properties:
                  recommendations:
                    type: array
                    maxItems: 3
                    items: { $ref: "#/components/schemas/Recommendation" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /recommendations/{recommendationId}/click:
    parameters:
      - $ref: "#/components/parameters/RecommendationId"
    post:
      tags: [Dashboard]
      operationId: clickRecommendation
      summary: Record that I opened a recommendation
      description: "Roles: the learner it was shown to. Sets `clickedAt`, used for the Precision@3 and MRR evaluation."
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /progress/me:
    get:
      tags: [Dashboard]
      operationId: getMyProgress
      summary: My goal readiness and next best step
      description: "Roles: learner. Average mastery against my target band, and the first recommendation as the next best step."
      responses:
        "200":
          description: My progress
          content:
            application/json:
              schema:
                type: object
                required: [progress, nextBestStep, recommendations, message]
                properties:
                  progress: { $ref: "#/components/schemas/LearnerProgress" }
                  nextBestStep:
                    oneOf:
                      - $ref: "#/components/schemas/Recommendation"
                      - type: "null"
                  recommendations:
                    type: array
                    maxItems: 3
                    items: { $ref: "#/components/schemas/Recommendation" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------
  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: My notifications
      description: "Roles: any. Newest first. `unread=true` lists only unread ones. `unreadCount` is always over all my notifications."
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [notifications, unreadCount, message]
                    properties:
                      notifications:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }
                      unreadCount: { type: integer }
                      message: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      description: "Roles: the notification's recipient (another user's notification is a 404). Marking it again keeps the first `readAt`."
      responses:
        "200":
          description: The notification
          content:
            application/json:
              schema:
                type: object
                required: [notification, message]
                properties:
                  notification: { $ref: "#/components/schemas/Notification" }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all my notifications as read
      description: "Roles: any."
      responses:
        "200":
          description: How many were marked
          content:
            application/json:
              schema:
                type: object
                required: [updated, message]
                properties:
                  updated: { type: integer }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PassageId:
      name: passageId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    QuizId:
      name: quizId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Search:
      name: q
      in: query
      description: Case-insensitive text search. Blank means no search.
      schema: { type: string, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Message:
      description: Done
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    ValidationError:
      description: The input failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              message: Validation failed
              details: ['"email" must be a valid email']
    Unauthorized:
      description: Not logged in, or a bad or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { message: Please log in }
    Forbidden:
      description: Your role or ownership doesn't allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { message: You don't have permission to do this }
    NotFound:
      description: Not found, or not visible to you
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { message: Course not found }
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { message: Only draft or rejected courses can be edited }
    TooManyRequests:
      description: Too many attempts from this address; try again later
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { message: Too many requests, please try again later }

  schemas:
    # ----- Shared -----
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
            details:
              type: array
              items: { type: string }
              description: One message per invalid field (400 only).
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0, description: Rows matching the filters, over all pages. }
        totalPages: { type: integer, minimum: 1, description: "At least 1, even when there are no rows." }
      example: { page: 1, pageSize: 20, total: 42, totalPages: 3 }
    UserRef:
      type: object
      required: [userId, fullName]
      properties:
        userId: { type: integer }
        fullName: { type: string }

    # ----- Enums (same values as schema.prisma) -----
    UserRole:
      type: string
      enum: [learner, instructor, admin]
    CourseLevel:
      type: string
      enum: [beginner, intermediate, advanced]
    CourseStatus:
      type: string
      enum: [draft, pending_review, approved, rejected, archived]
    LessonKind:
      type: string
      enum: [core, remedial]
    MediaType:
      type: string
      enum: [reading_text, listening_audio, video]
    SkillCategory:
      type: string
      enum: [listening, reading, writing, speaking]
    QuestionType:
      type: string
      enum: [multiple_choice, true_false_not_given, gap_fill, matching, error_identification]
    QuizKind:
      type: string
      enum: [diagnostic, lesson, practice]
    ProgressStatus:
      type: string
      enum: [in_progress, completed]

    # ----- Users and auth -----
    User:
      type: object
      required: [userId, email, fullName, role, targetBand, isActive, createdAt]
      properties:
        userId: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        targetBand:
          type: [number, "null"]
          minimum: 0
          maximum: 9
          multipleOf: 0.5
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
      example:
        userId: 3
        email: learner@ieltstudy.dev
        fullName: Lena Learner
        role: learner
        targetBand: 6.5
        isActive: true
        createdAt: "2026-10-23T19:10:10.868Z"
    RegisterInput:
      type: object
      required: [email, fullName, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        fullName: { type: string, minLength: 3, maxLength: 30 }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: bcrypt only uses the first 72 bytes, so longer passwords are rejected.
      example:
        email: new.learner@example.com
        fullName: Minh Anh
        password: correct-horse-battery
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
      example:
        email: learner@ieltstudy.dev
        password: your-seed-password
    AuthResult:
      type: object
      required: [user, token, message]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token:
          type: string
          description: "JWT, valid for 1 day. Send it as `Authorization: Bearer <token>`."
        message: { type: string }
      example:
        user:
          userId: 3
          email: learner@ieltstudy.dev
          fullName: Lena Learner
          role: learner
          targetBand: 6.5
          isActive: true
          createdAt: "2026-10-23T19:10:10.868Z"
        token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIzIn0.signature
        message: Logged in
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        password:
          type: string
          minLength: 8
          description: At most 72 bytes (bcrypt's limit), like at registration.
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 3, maxLength: 30 }
        targetBand:
          type: [number, "null"]
          minimum: 0
          maximum: 9
          multipleOf: 0.5
      example:
        targetBand: 7
    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
        isActive: { type: boolean }
      example:
        role: instructor

    # ----- Skills -----
    Skill:
      type: object
      required: [skillId, skillCode, name, category, description]
      properties:
        skillId: { type: integer }
        skillCode: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
        name: { type: string }
        category: { $ref: "#/components/schemas/SkillCategory" }
        description: { type: [string, "null"] }
      example:
        skillId: 12
        skillCode: W_CONDITIONALS
        name: "Grammar: conditionals"
        category: writing
        description: Forming zero to third and mixed conditionals.
    SkillTag:
      description: A skill attached to a lesson or question, with its weight.
      type: object
      required: [skillId, skillCode, name, weight]
      properties:
        skillId: { type: integer }
        skillCode: { type: string }
        name: { type: string }
        weight: { type: number, exclusiveMinimum: 0, maximum: 1 }
      example:
        skillId: 13
        skillCode: W_INVERSION
        name: "Grammar: inversion"
        weight: 1
    SkillWeight:
      description: Input form of a skill tag.
      type: object
      required: [skillId, weight]
      properties:
        skillId: { type: integer, minimum: 1 }
        weight: { type: number, exclusiveMinimum: 0, maximum: 1 }
      example:
        skillId: 13
        weight: 1

    # ----- Courses -----
    Course:
      type: object
      required:
        [
          courseId,
          instructor,
          title,
          description,
          targetLevel,
          status,
          reviewFeedback,
          submittedAt,
          reviewedAt,
          lessonCount,
          createdAt,
          updatedAt,
        ]
      properties:
        courseId: { type: integer }
        instructor:
          type: object
          required: [userId, fullName]
          properties:
            userId: { type: integer }
            fullName: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        targetLevel: { $ref: "#/components/schemas/CourseLevel" }
        status: { $ref: "#/components/schemas/CourseStatus" }
        reviewFeedback:
          type: [string, "null"]
          description: The admin's feedback from the last review. Shown to the owner and admins only (null for learners).
        submittedAt: { type: [string, "null"], format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        lessonCount: { type: integer, description: Number of core lessons. }
        isEnrolled:
          type: boolean
          description: Learners only. Whether I am enrolled.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        courseId: 3
        instructor: { userId: 2, fullName: Ian Instructor }
        title: Band 7+ Mastery
        description: Advanced grammar, vocabulary and inference for learners aiming at Band 7 and above.
        targetLevel: advanced
        status: approved
        reviewFeedback: null
        submittedAt: "2026-10-23T19:10:11.000Z"
        reviewedAt: "2026-10-23T19:10:11.000Z"
        lessonCount: 3
        isEnrolled: false
        createdAt: "2026-10-23T19:10:11.000Z"
        updatedAt: "2026-10-23T19:10:11.000Z"
    CourseList:
      type: object
      required: [courses, message]
      properties:
        courses:
          type: array
          items: { $ref: "#/components/schemas/Course" }
        message: { type: string }
    PagedCourseList:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - $ref: "#/components/schemas/CourseList"
    CourseResult:
      type: object
      required: [course, message]
      properties:
        course: { $ref: "#/components/schemas/Course" }
        message: { type: string }
    CourseInput:
      type: object
      required: [title, targetLevel]
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 5000 }
        targetLevel: { $ref: "#/components/schemas/CourseLevel" }
      example:
        title: Listening Essentials
        description: Strategies for all four parts of the Listening test.
        targetLevel: intermediate
    CourseUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 5000 }
        targetLevel: { $ref: "#/components/schemas/CourseLevel" }
    ApproveInput:
      type: object
      properties:
        feedback: { type: string, maxLength: 5000 }
    RejectInput:
      type: object
      required: [feedback]
      properties:
        feedback: { type: string, minLength: 1, maxLength: 5000 }
      example:
        feedback: Lesson 2 needs a skill tag, and the quiz has only one question.
    Enrollment:
      type: object
      required:
        [course, enrolledAt, completedAt, completedLessons, totalCoreLessons, progressPercent]
      properties:
        course: { $ref: "#/components/schemas/Course" }
        enrolledAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        completedLessons: { type: integer, description: Core lessons I have completed. }
        totalCoreLessons: { type: integer }
        progressPercent: { type: number, minimum: 0, maximum: 100 }
    EnrollmentResult:
      type: object
      required: [enrollment, message]
      properties:
        enrollment: { $ref: "#/components/schemas/Enrollment" }
        message: { type: string }

    # ----- Lessons -----
    Lesson:
      type: object
      required: [lessonId, courseId, title, kind, orderIndex, skills]
      properties:
        lessonId: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        kind: { $ref: "#/components/schemas/LessonKind" }
        orderIndex:
          { type: integer, minimum: 0, description: Position among lessons of the same kind. }
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillTag" }
        progress:
          description: Learners only. My progress, or null if I haven't started.
          oneOf:
            - $ref: "#/components/schemas/LessonProgress"
            - type: "null"
        locked:
          type: boolean
          description: Learners only. True until the previous core lesson is mastered (the rule is set in Phase 3; until then always false).
      example:
        lessonId: 13
        courseId: 3
        title: Inversion for emphasis
        kind: core
        orderIndex: 0
        skills:
          - { skillId: 13, skillCode: W_INVERSION, name: "Grammar: inversion", weight: 1 }
        progress: null
        locked: false
    LessonDetail:
      description: A lesson with everything needed to study it.
      allOf:
        - $ref: "#/components/schemas/Lesson"
        - type: object
          required: [content, passages, quizzes]
          properties:
            content: { type: [string, "null"], description: Lesson body in Markdown. }
            passages:
              type: array
              items: { $ref: "#/components/schemas/Passage" }
            quizzes:
              type: array
              items: { $ref: "#/components/schemas/QuizSummary" }
    LessonResult:
      type: object
      required: [lesson, message]
      properties:
        lesson: { $ref: "#/components/schemas/LessonDetail" }
        message: { type: string }
    LessonInput:
      type: object
      required: [title, kind, orderIndex, skills]
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        content: { type: [string, "null"], maxLength: 50000 }
        kind: { $ref: "#/components/schemas/LessonKind" }
        orderIndex: { type: integer, minimum: 0 }
        skills:
          type: array
          minItems: 1
          description: At least one skill, so the recommender can match the lesson to weak skills. No skill twice.
          items: { $ref: "#/components/schemas/SkillWeight" }
      example:
        title: Third conditional drill
        content: "If + past perfect, would have + past participle."
        kind: remedial
        orderIndex: 0
        skills:
          - { skillId: 12, weight: 1 }
    LessonUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        content: { type: [string, "null"], maxLength: 50000 }
        kind: { $ref: "#/components/schemas/LessonKind" }
        orderIndex: { type: integer, minimum: 0 }
        skills:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SkillWeight" }
    LessonProgress:
      type: object
      required: [lessonId, status, startedAt, completedAt]
      properties:
        lessonId: { type: integer }
        status: { $ref: "#/components/schemas/ProgressStatus" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    ProgressInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ProgressStatus" }
      example:
        status: completed

    # ----- Content -----
    Passage:
      type: object
      required: [passageId, lessonId, type, title, content, mediaPath, mediaUrl, orderIndex]
      properties:
        passageId: { type: integer }
        lessonId: { type: [integer, "null"], description: Null for diagnostic passages. }
        type: { $ref: "#/components/schemas/MediaType" }
        title: { type: [string, "null"] }
        content:
          type: [string, "null"]
          description: Reading text, or the transcript of audio or video.
        mediaPath: { type: [string, "null"], description: Storage object path. }
        mediaUrl:
          type: [string, "null"]
          format: uri
          description: Signed URL to play the media, valid for 1 hour. Generated on every read. Null for reading text, or when the file can't be signed (for example it was never uploaded).
        orderIndex: { type: integer }
      example:
        passageId: 1
        lessonId: null
        type: listening_audio
        title: Joining a sports centre
        content: "Receptionist: Good morning, Riverside Sports Centre. How can I help?"
        mediaPath: seed/diagnostic/listening-1.mp3
        mediaUrl: https://example.supabase.co/storage/v1/object/sign/media/seed/diagnostic/listening-1.mp3?token=abc
        orderIndex: 0
    PassageResult:
      type: object
      required: [passage, message]
      properties:
        passage: { $ref: "#/components/schemas/Passage" }
        message: { type: string }
    PassageInput:
      type: object
      required: [type]
      description: "`reading_text` needs `content`; `listening_audio` and `video` need `mediaPath`."
      properties:
        lessonId: { type: [integer, "null"], minimum: 1 }
        type: { $ref: "#/components/schemas/MediaType" }
        title: { type: [string, "null"], maxLength: 255 }
        content: { type: [string, "null"], maxLength: 50000 }
        mediaPath: { type: [string, "null"], maxLength: 1024 }
        orderIndex: { type: integer, minimum: 0, default: 0 }
      example:
        lessonId: 13
        type: reading_text
        title: The first coffee houses
        content: Coffee was first cultivated in Yemen in the fifteenth century.
        orderIndex: 0
    PassageUpdate:
      type: object
      minProperties: 1
      properties:
        type: { $ref: "#/components/schemas/MediaType" }
        title: { type: [string, "null"], maxLength: 255 }
        content: { type: [string, "null"], maxLength: 50000 }
        mediaPath: { type: [string, "null"], maxLength: 1024 }
        orderIndex: { type: integer, minimum: 0 }
    UploadRequest:
      type: object
      required: [fileName, contentType]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/wav, video/mp4, video/webm, image/png, image/jpeg]
      example:
        fileName: part1-booking.mp3
        contentType: audio/mpeg
    UploadTicket:
      type: object
      required: [uploadUrl, path]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: "`PUT` the file here. Valid for 2 hours."
        path:
          type: string
          description: Send this as `mediaPath` when creating the passage.
      example:
        uploadUrl: https://example.supabase.co/storage/v1/object/upload/sign/media/2/8f3c-part1-booking.mp3?token=abc
        path: 2/8f3c-part1-booking.mp3

    # ----- Questions -----
    ChoiceOption:
      type: object
      required: [id, text]
      properties:
        id: { type: string, description: "A, B, C, ..." }
        text: { type: string }
    MatchingOptions:
      type: object
      required: [items, choices]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChoiceOption" }
        choices:
          type: array
          items: { $ref: "#/components/schemas/ChoiceOption" }
    QuestionOptions:
      description: |
        Depends on `questionType`:
        - `multiple_choice`, `error_identification`: a list of `{ id, text }`
        - `matching`: `{ items, choices }`
        - `true_false_not_given`, `gap_fill`: null
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/ChoiceOption" }
        - $ref: "#/components/schemas/MatchingOptions"
        - type: "null"
    AnswerKey:
      description: |
        Depends on `questionType`:
        - `multiple_choice`, `error_identification`: the option id, e.g. `"B"`
        - `true_false_not_given`: `"true"`, `"false"` or `"not_given"`
        - `gap_fill`: the accepted answers, e.g. `["colour", "color"]` (compared ignoring case and extra spaces)
        - `matching`: item id → choice id, e.g. `{ "B": "ii" }`
      oneOf:
        - type: string
        - type: array
          minItems: 1
          items: { type: string }
        - type: object
          additionalProperties: { type: string }
    Answer:
      description: |
        A learner's answer: a string (option id, `true`/`false`/`not_given`, or the gap-fill text),
        or for `matching` an object of item id → choice id.
      oneOf:
        - type: string
          maxLength: 500
        - type: object
          additionalProperties: { type: string }
    Question:
      description: Author view, with the answer.
      type: object
      required:
        [
          questionId,
          passageId,
          questionType,
          questionText,
          options,
          answerKey,
          explanation,
          difficulty,
          skills,
          createdById,
        ]
      properties:
        questionId: { type: integer }
        passageId: { type: [integer, "null"] }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        questionText: { type: string }
        options: { $ref: "#/components/schemas/QuestionOptions" }
        answerKey: { $ref: "#/components/schemas/AnswerKey" }
        explanation: { type: [string, "null"] }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillTag" }
        createdById: { type: integer }
      example:
        questionId: 3
        passageId: 1
        questionType: multiple_choice
        questionText: When do classes start?
        options:
          - { id: A, text: 12 March }
          - { id: B, text: 14 March }
          - { id: C, text: 4 March }
        answerKey: B
        explanation: "The receptionist corrects herself: the 12th is a holiday."
        difficulty: 3
        skills:
          - { skillId: 5, skillCode: L_DISTRACTORS, name: Handling distractors, weight: 1 }
        createdById: 1
    QuestionForLearner:
      description: Learner view, before submitting. No answer, explanation or skill weights.
      type: object
      required: [questionId, passageId, questionType, questionText, options]
      properties:
        questionId: { type: integer }
        passageId: { type: [integer, "null"] }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        questionText: { type: string }
        options: { $ref: "#/components/schemas/QuestionOptions" }
      example:
        questionId: 3
        passageId: 1
        questionType: multiple_choice
        questionText: When do classes start?
        options:
          - { id: A, text: 12 March }
          - { id: B, text: 14 March }
          - { id: C, text: 4 March }
    QuestionResult:
      type: object
      required: [question, message]
      properties:
        question: { $ref: "#/components/schemas/Question" }
        message: { type: string }
    QuestionInput:
      description: |
        `options` and `answerKey` must fit `questionType` (400 otherwise):
        - `multiple_choice`, `error_identification`: at least 2 options with different ids; `answerKey` is one of those ids.
        - `true_false_not_given`: no `options` (null); `answerKey` is `"true"`, `"false"` or `"not_given"`.
        - `gap_fill`: no `options` (null); `answerKey` is the list of accepted answers.
        - `matching`: `{ items, choices }`, ids different within each list; `answerKey` maps **every** item id to a choice id, and nothing else.
      type: object
      required: [questionType, questionText, answerKey, skills]
      properties:
        passageId: { type: [integer, "null"], minimum: 1 }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        questionText: { type: string, minLength: 1, maxLength: 2000 }
        options: { $ref: "#/components/schemas/QuestionOptions" }
        answerKey: { $ref: "#/components/schemas/AnswerKey" }
        explanation: { type: [string, "null"], maxLength: 2000 }
        difficulty: { type: integer, minimum: 1, maximum: 5, default: 3 }
        skills:
          type: array
          minItems: 1
          description: The question's Q-matrix row. Weights must sum to 1, and no skill may appear twice.
          items: { $ref: "#/components/schemas/SkillWeight" }
      example:
        passageId: null
        questionType: multiple_choice
        questionText: "If she ______ harder last year, she would have passed the exam."
        options:
          - { id: A, text: studied }
          - { id: B, text: had studied }
          - { id: C, text: has studied }
        answerKey: B
        explanation: Third conditional uses the past perfect after 'if'.
        difficulty: 3
        skills:
          - { skillId: 12, weight: 1 }
    QuestionUpdate:
      type: object
      minProperties: 1
      properties:
        passageId: { type: [integer, "null"], minimum: 1 }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        questionText: { type: string, minLength: 1, maxLength: 2000 }
        options: { $ref: "#/components/schemas/QuestionOptions" }
        answerKey: { $ref: "#/components/schemas/AnswerKey" }
        explanation: { type: [string, "null"], maxLength: 2000 }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        skills:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SkillWeight" }

    # ----- Quizzes -----
    QuizSummary:
      type: object
      required: [quizId, kind, title, questionCount, timeLimitSeconds]
      properties:
        quizId: { type: integer }
        kind: { $ref: "#/components/schemas/QuizKind" }
        title: { type: string }
        questionCount: { type: integer }
        timeLimitSeconds: { type: [integer, "null"] }
      example:
        quizId: 1
        kind: diagnostic
        title: IELTS placement test
        questionCount: 30
        timeLimitSeconds: 2700
    Quiz:
      description: Author view, with full questions and answers.
      allOf:
        - $ref: "#/components/schemas/QuizSummary"
        - type: object
          required: [lessonId, description, createdById, passages, questions]
          properties:
            lessonId: { type: [integer, "null"] }
            description: { type: [string, "null"] }
            createdById: { type: integer }
            passages:
              type: array
              description: The passages the questions refer to, each listed once.
              items: { $ref: "#/components/schemas/Passage" }
            questions:
              type: array
              description: In quiz order.
              items: { $ref: "#/components/schemas/Question" }
    QuizForLearner:
      description: Learner view. Questions have no answers.
      allOf:
        - $ref: "#/components/schemas/QuizSummary"
        - type: object
          required: [lessonId, description, passages, questions]
          properties:
            lessonId: { type: [integer, "null"] }
            description: { type: [string, "null"] }
            passages:
              type: array
              description: The passages the questions refer to, each listed once.
              items: { $ref: "#/components/schemas/Passage" }
            questions:
              type: array
              description: In quiz order.
              items: { $ref: "#/components/schemas/QuestionForLearner" }
    QuizResult:
      type: object
      required: [quiz, message]
      properties:
        quiz: { $ref: "#/components/schemas/Quiz" }
        message: { type: string }
    QuizInput:
      type: object
      required: [kind, title, questionIds]
      properties:
        kind: { $ref: "#/components/schemas/QuizKind" }
        lessonId:
          type: [integer, "null"]
          minimum: 1
          description: Required for `lesson` and `practice` quizzes; must be null for the diagnostic.
        title: { type: string, minLength: 3, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 5000 }
        timeLimitSeconds: { type: [integer, "null"], minimum: 1 }
        questionIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: In the order learners will see them.
          items: { type: integer, minimum: 1 }
      example:
        kind: lesson
        lessonId: 13
        title: Inversion check
        timeLimitSeconds: null
        questionIds: [39, 40, 41, 42]
    QuizUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 5000 }
        timeLimitSeconds: { type: [integer, "null"], minimum: 1 }
        questionIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }

    # ----- Attempts -----
    Attempt:
      type: object
      required: [attemptId, quizId, status, startedAt, completedAt, totalScore, maxScore]
      properties:
        attemptId: { type: integer }
        quizId: { type: integer }
        status:
          type: string
          enum: [in_progress, completed]
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        totalScore:
          { type: [integer, "null"], description: "Number of correct answers, once completed." }
        maxScore: { type: integer, description: Number of questions. }
      example:
        attemptId: 7
        quizId: 1
        status: completed
        startedAt: "2026-10-24T08:00:00.000Z"
        completedAt: "2026-10-24T08:38:12.000Z"
        totalScore: 21
        maxScore: 30
    AttemptSummary:
      allOf:
        - $ref: "#/components/schemas/Attempt"
        - type: object
          required: [quiz]
          properties:
            quiz: { $ref: "#/components/schemas/QuizSummary" }
    StartAttemptResult:
      type: object
      required: [attempt, quiz, message]
      properties:
        attempt: { $ref: "#/components/schemas/Attempt" }
        quiz: { $ref: "#/components/schemas/QuizForLearner" }
        message: { type: string }
    SubmitInput:
      type: object
      required: [responses]
      properties:
        responses:
          type: array
          maxItems: 200
          description: In the order I answered. Leave out questions I skipped.
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: integer, minimum: 1 }
              answer: { $ref: "#/components/schemas/Answer" }
              responseTimeSeconds: { type: number, minimum: 0 }
      example:
        responses:
          - { questionId: 1, answer: Hartley, responseTimeSeconds: 14.2 }
          - { questionId: 3, answer: A, responseTimeSeconds: 9.8 }
    ResponseResult:
      description: One question in a graded attempt.
      type: object
      required:
        [
          questionId,
          questionText,
          questionType,
          userAnswer,
          isCorrect,
          correctAnswer,
          explanation,
          attemptOrder,
          responseTimeSeconds,
          skills,
        ]
      properties:
        questionId: { type: integer }
        questionText: { type: string }
        questionType: { $ref: "#/components/schemas/QuestionType" }
        userAnswer:
          description: My answer, or null if I skipped the question.
          oneOf:
            - $ref: "#/components/schemas/Answer"
            - type: "null"
        isCorrect: { type: boolean }
        correctAnswer: { $ref: "#/components/schemas/AnswerKey" }
        explanation: { type: [string, "null"] }
        attemptOrder:
          { type: [integer, "null"], description: "1 = answered first. Null if skipped." }
        responseTimeSeconds: { type: [number, "null"] }
        skills:
          type: array
          items: { $ref: "#/components/schemas/SkillTag" }
    MasteryChange:
      type: object
      required: [skillId, skillCode, name, before, after]
      properties:
        skillId: { type: integer }
        skillCode: { type: string }
        name: { type: string }
        before:
          {
            type: [number, "null"],
            minimum: 0,
            maximum: 1,
            description: Null the first time this skill is measured.,
          }
        after: { type: number, minimum: 0, maximum: 1 }
      example:
        skillId: 5
        skillCode: L_DISTRACTORS
        name: Handling distractors
        before: 0.71
        after: 0.58
    AttemptResult:
      type: object
      required: [attempt, quiz, scorePercent, responses, masteryChanges, recommendations]
      properties:
        attempt: { $ref: "#/components/schemas/Attempt" }
        quiz: { $ref: "#/components/schemas/QuizSummary" }
        scorePercent:
          { type: [number, "null"], minimum: 0, maximum: 100, description: Null until completed. }
        responses:
          type: array
          description: Every question in quiz order. Empty before submitting.
          items: { $ref: "#/components/schemas/ResponseResult" }
        masteryChanges:
          type: array
          description: How each measured skill's mastery moved. Empty when the attempt had no answers.
          items: { $ref: "#/components/schemas/MasteryChange" }
        recommendations:
          type: array
          maxItems: 3
          description: What to study next, made from this attempt. Empty when every skill is at or above 0.65.
          items: { $ref: "#/components/schemas/Recommendation" }
      example:
        attempt:
          attemptId: 7
          quizId: 1
          status: completed
          startedAt: "2026-10-24T08:00:00.000Z"
          completedAt: "2026-10-24T08:38:12.000Z"
          totalScore: 21
          maxScore: 30
        quiz:
          {
            quizId: 1,
            kind: diagnostic,
            title: IELTS placement test,
            questionCount: 30,
            timeLimitSeconds: 2700,
          }
        scorePercent: 70
        responses:
          - questionId: 3
            questionText: When do classes start?
            questionType: multiple_choice
            userAnswer: A
            isCorrect: false
            correctAnswer: B
            explanation: "The receptionist corrects herself: the 12th is a holiday."
            attemptOrder: 3
            responseTimeSeconds: 9.8
            skills:
              - { skillId: 5, skillCode: L_DISTRACTORS, name: Handling distractors, weight: 1 }
        masteryChanges:
          - {
              skillId: 5,
              skillCode: L_DISTRACTORS,
              name: Handling distractors,
              before: 0.71,
              after: 0.58,
            }
        recommendations:
          - recommendationId: 42
            type: lesson
            lesson:
              {
                lessonId: 20,
                title: "Catching distractors and the speaker's main point",
                courseId: 3,
                courseTitle: Band 7+ Mastery,
              }
            quiz: null
            skill: { skillId: 5, skillCode: L_DISTRACTORS, name: Handling distractors }
            masteryProb: 0.58
            rank: 1
            score: 0.91
            rationale: "Recommended because your mastery of 'Handling distractors' is 0.58, below 0.65."
            createdAt: "2026-10-24T08:38:12.000Z"
            clickedAt: null

    # ----- Dashboard -----
    Mastery:
      type: object
      required: [skillId, skillCode, name, category, masteryProb, observations, updatedAt]
      properties:
        skillId: { type: integer }
        skillCode: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/SkillCategory" }
        masteryProb: { type: number, minimum: 0, maximum: 1 }
        observations: { type: integer, description: How many answers have updated this skill. }
        updatedAt: { type: string, format: date-time }
      example:
        skillId: 12
        skillCode: W_CONDITIONALS
        name: "Grammar: conditionals"
        category: writing
        masteryProb: 0.48
        observations: 3
        updatedAt: "2026-10-24T08:38:12.000Z"
    Recommendation:
      type: object
      required:
        [
          recommendationId,
          type,
          lesson,
          quiz,
          skill,
          masteryProb,
          rank,
          score,
          rationale,
          createdAt,
          clickedAt,
        ]
      properties:
        recommendationId: { type: integer }
        type:
          type: string
          enum: [lesson, quiz]
          description: Which of `lesson` or `quiz` is set (exactly one).
        lesson:
          oneOf:
            - type: object
              required: [lessonId, title, courseId, courseTitle, isEnrolled]
              properties:
                lessonId: { type: integer }
                title: { type: string }
                courseId: { type: integer }
                courseTitle: { type: string }
                isEnrolled:
                  type: boolean
                  description: Whether the learner is enrolled in the course. They must enrol before opening the lesson.
            - type: "null"
        quiz:
          oneOf:
            - type: object
              required: [quizId, title]
              properties:
                quizId: { type: integer }
                title: { type: string }
            - type: "null"
        skill:
          description: The weak skill this addresses.
          type: object
          required: [skillId, skillCode, name]
          properties:
            skillId: { type: integer }
            skillCode: { type: string }
            name: { type: string }
        masteryProb:
          {
            type: number,
            minimum: 0,
            maximum: 1,
            description: My mastery of the skill when recommended.,
          }
        rank: { type: integer, minimum: 1, description: "1 = best match." }
        score: { type: number, description: Ranking score (formula decided in Phase 3). }
        rationale: { type: string, description: "Why this was recommended, in plain words." }
        createdAt: { type: string, format: date-time }
        clickedAt: { type: [string, "null"], format: date-time }
      example:
        recommendationId: 42
        type: lesson
        lesson:
          {
            lessonId: 20,
            title: "Catching distractors and the speaker's main point",
            courseId: 3,
            courseTitle: Band 7+ Mastery,
          }
        quiz: null
        skill: { skillId: 5, skillCode: L_DISTRACTORS, name: Handling distractors }
        masteryProb: 0.58
        rank: 1
        score: 0.91
        rationale: "Recommended because your mastery of 'Handling distractors' is 0.58, below 0.65."
        createdAt: "2026-10-24T08:38:12.000Z"
        clickedAt: null
    AdminStats:
      type: object
      required: [users, courses, enrollments, attempts, activeLearnersLast7Days, completion, learning]
      properties:
        users:
          type: object
          required: [total, active, inactive, byRole]
          properties:
            total: { type: integer }
            active: { type: integer }
            inactive: { type: integer }
            byRole:
              type: object
              required: [learner, instructor, admin]
              properties:
                learner: { type: integer }
                instructor: { type: integer }
                admin: { type: integer }
        courses:
          type: object
          required: [total, byStatus]
          properties:
            total: { type: integer }
            byStatus:
              type: object
              required: [draft, pending_review, approved, rejected, archived]
              properties:
                draft: { type: integer }
                pending_review: { type: integer }
                approved: { type: integer }
                rejected: { type: integer }
                archived: { type: integer }
        enrollments: { type: integer }
        attempts:
          type: object
          required: [completed, completedLast7Days]
          properties:
            completed: { type: integer }
            completedLast7Days: { type: integer }
        activeLearnersLast7Days:
          type: integer
          description: Learners who completed at least one attempt in the last 7 days.
        completion:
          type: object
          description: Course completion over approved courses. A learner completes a course by completing all its core lessons.
          required: [averageProgressPercent, completionRatePercent, courses]
          properties:
            averageProgressPercent:
              { type: [number, "null"], description: "Mean core-lesson progress over all enrolments. Null with no enrolments." }
            completionRatePercent:
              { type: [number, "null"], description: "Share of enrolments with every core lesson completed. Null with no enrolments." }
            courses:
              type: array
              items:
                type: object
                required: [courseId, title, coreLessons, enrolled, completed, completionRatePercent, averageProgressPercent]
                properties:
                  courseId: { type: integer }
                  title: { type: string }
                  coreLessons: { type: integer }
                  enrolled: { type: integer }
                  completed: { type: integer }
                  completionRatePercent: { type: [number, "null"] }
                  averageProgressPercent: { type: [number, "null"] }
        learning:
          type: object
          required: [averageScorePercent, scoredAttempts, averageMastery, masteredPercent, byCategory, bySkill]
          properties:
            averageScorePercent:
              { type: [number, "null"], description: "Mean score of completed attempts (diagnostic included). Null with none." }
            scoredAttempts: { type: integer }
            averageMastery: { type: [number, "null"], minimum: 0, maximum: 1 }
            masteredPercent:
              { type: [number, "null"], description: "Share of measured learner-skill pairs at or above 0.65." }
            byCategory:
              type: array
              items:
                type: object
                required: [category, averageMastery, learners]
                properties:
                  category: { $ref: "#/components/schemas/SkillCategory" }
                  averageMastery: { type: [number, "null"] }
                  learners: { type: integer, description: Learners measured in at least one skill of this category. }
            bySkill:
              type: array
              items:
                type: object
                required: [skillId, skillCode, name, category, averageMastery, learners]
                properties:
                  skillId: { type: integer }
                  skillCode: { type: string }
                  name: { type: string }
                  category: { $ref: "#/components/schemas/SkillCategory" }
                  averageMastery: { type: [number, "null"] }
                  learners: { type: integer }
      example:
        users:
          { total: 42, active: 41, inactive: 1, byRole: { learner: 38, instructor: 3, admin: 1 } }
        courses:
          {
            total: 5,
            byStatus: { draft: 1, pending_review: 1, approved: 3, rejected: 0, archived: 0 },
          }
        enrollments: 57
        attempts: { completed: 212, completedLast7Days: 64 }
        activeLearnersLast7Days: 19
        completion:
          averageProgressPercent: 41.3
          completionRatePercent: 12.5
          courses:
            - { courseId: 1, title: Band 5 Foundations, coreLessons: 8, enrolled: 24, completed: 3, completionRatePercent: 12.5, averageProgressPercent: 41.3 }
        learning:
          averageScorePercent: 63.2
          scoredAttempts: 212
          averageMastery: 0.54
          masteredPercent: 31.6
          byCategory:
            - { category: reading, averageMastery: 0.58, learners: 30 }
          bySkill:
            - { skillId: 8, skillCode: R_TFNG, name: True / False / Not Given, category: reading, averageMastery: 0.49, learners: 30 }

    # ----- BKT -----
    LessonGate:
      type: object
      required: [lessonId, locked, reason]
      properties:
        lessonId: { type: integer }
        locked: { type: boolean }
        reason: { type: [string, "null"], description: Why it is locked, in plain words. Null when open. }
    LearnerProgress:
      type: object
      required:
        [
          targetBand,
          averageMastery,
          masteredSkillsCount,
          totalSkillsCount,
          goalReadinessPercent,
          enrolledCoursesCount,
          completedCoursesCount,
          completedAttemptsCount,
        ]
      properties:
        targetBand: { type: [number, "null"] }
        averageMastery: { type: number, minimum: 0, maximum: 1 }
        masteredSkillsCount: { type: integer }
        totalSkillsCount: { type: integer }
        goalReadinessPercent: { type: integer, minimum: 0, maximum: 100 }
        enrolledCoursesCount: { type: integer }
        completedCoursesCount: { type: integer }
        completedAttemptsCount: { type: integer }

    # ----- Audit log -----
    AuditEntry:
      type: object
      required: [auditId, action, actor, targetType, targetId, summary, details, createdAt]
      properties:
        auditId: { type: integer }
        action: { type: string, description: "`<subject>.<verb>`, e.g. `course.approve`." }
        actor:
          oneOf:
            - type: object
              required: [userId, fullName, role]
              properties:
                userId: { type: integer }
                fullName: { type: string }
                role: { $ref: "#/components/schemas/UserRole" }
            - type: "null"
          description: Null if the admin's account was deleted since.
        targetType: { type: [string, "null"], enum: [user, course, report, comment, null] }
        targetId: { type: [integer, "null"] }
        summary: { type: [string, "null"], description: One line for the table. }
        details: { type: [object, "null"], description: "What changed, e.g. `{ from: learner, to: instructor }`." }
        createdAt: { type: string, format: date-time }
      example:
        auditId: 12
        action: user.role_change
        actor: { userId: 1, fullName: Ada Admin, role: admin }
        targetType: user
        targetId: 7
        summary: "Changed the role of ivan@ieltstudy.dev from learner to instructor"
        details: { from: learner, to: instructor }
        createdAt: "2026-11-24T08:00:00.000Z"

    # ----- Grading -----
    Feedback:
      type: object
      required: [attemptId, comment, totalScore, gradedBy, gradedAt]
      properties:
        attemptId: { type: integer }
        comment: { type: string }
        totalScore:
          type: [integer, "null"]
          description: The score the instructor set by hand, or null to keep the automatic one.
        gradedBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        gradedAt: { type: string, format: date-time, description: When the feedback was last saved. }
    FeedbackInput:
      type: object
      required: [comment]
      properties:
        comment: { type: string, maxLength: 5000, description: May be empty when only the score changes. }
        totalScore: { type: [integer, "null"], minimum: 0 }
    Submission:
      type: object
      required: [attemptId, learner, course, quiz, totalScore, maxScore, completedAt, feedback]
      properties:
        attemptId: { type: integer }
        learner:
          type: object
          required: [userId, fullName, email]
          properties:
            userId: { type: integer }
            fullName: { type: string }
            email: { type: string }
        course:
          type: object
          required: [courseId, title]
          properties:
            courseId: { type: integer }
            title: { type: string }
        quiz:
          type: object
          required: [quizId, title]
          properties:
            quizId: { type: integer }
            title: { type: string }
        totalScore: { type: [integer, "null"], description: The automatic score. }
        maxScore: { type: integer }
        completedAt: { type: string, format: date-time }
        feedback:
          oneOf:
            - $ref: "#/components/schemas/Feedback"
            - type: "null"
    InstructorLearner:
      type: object
      required: [user, courses, completedAttempts, lastActiveAt]
      properties:
        user:
          type: object
          required: [userId, fullName, email]
          properties:
            userId: { type: integer }
            fullName: { type: string }
            email: { type: string }
        courses:
          type: array
          description: Only my courses.
          items:
            type: object
            required: [courseId, title, completedLessons, totalCoreLessons, progressPercent]
            properties:
              courseId: { type: integer }
              title: { type: string }
              completedLessons: { type: integer }
              totalCoreLessons: { type: integer }
              progressPercent: { type: number, minimum: 0, maximum: 100 }
        completedAttempts: { type: integer, description: Completed attempts on my quizzes. }
        lastActiveAt: { type: [string, "null"], format: date-time }

    # ----- Autosave -----
    DraftAnswersInput:
      type: object
      required: [responses]
      properties:
        responses:
          type: array
          maxItems: 200
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId: { type: integer, minimum: 1 }
              answer: { $ref: "#/components/schemas/Answer" }
        remainingSeconds: { type: [number, "null"], description: Ignored; kept for client compatibility. }
    DraftAnswers:
      type: object
      required: [responses, remainingSeconds, savedAt, message]
      properties:
        responses:
          type: array
          items:
            type: object
            required: [questionId, answer, savedAt]
            properties:
              questionId: { type: integer }
              answer: { $ref: "#/components/schemas/Answer" }
              savedAt: { type: string, format: date-time, description: When this answer was first saved with its current value. }
        remainingSeconds: { type: [integer, "null"], description: Seconds left by the server's clock; null without a time limit. }
        savedAt: { type: [string, "null"], format: date-time, description: The last save. Null if nothing was saved. }
        message: { type: string }

    # ----- Discussion -----
    Comment:
      type: object
      required: [commentId, lessonId, parentId, author, body, removed, removedByModerator, edited, createdAt, updatedAt, canEdit, canDelete, replies]
      properties:
        commentId: { type: integer }
        lessonId: { type: integer }
        parentId: { type: [integer, "null"] }
        author:
          oneOf:
            - type: object
              required: [userId, fullName, role]
              properties:
                userId: { type: integer }
                fullName: { type: string }
                role: { $ref: "#/components/schemas/UserRole" }
            - type: "null"
          description: Null when the comment was removed.
        body: { type: [string, "null"], description: Null when the comment was removed. }
        removed: { type: boolean }
        removedByModerator: { type: boolean, description: Removed by someone other than its author. }
        edited: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        canEdit: { type: boolean, description: Whether I may edit it. }
        canDelete: { type: boolean, description: Whether I may remove it. }
        replies:
          type: array
          description: Replies oldest first. Always empty on a reply.
          items: { $ref: "#/components/schemas/Comment" }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        parentId: { type: [integer, "null"], minimum: 1 }
    CommentUpdate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    CommentResult:
      type: object
      required: [comment, message]
      properties:
        comment: { $ref: "#/components/schemas/Comment" }
        message: { type: string }

    # ----- Notifications -----
    Notification:
      type: object
      required: [notificationId, type, title, body, link, readAt, createdAt]
      properties:
        notificationId: { type: integer }
        type:
          type: string
          description: |
            `course.approved`, `course.rejected` (to the instructor), `course.new_lessons` (to enrolled learners),
            `attempt.feedback` (to the learner), `comment.reply` (to the parent comment's author), `report.handled` (to the reporter).
        title: { type: string }
        body: { type: [string, "null"] }
        link: { type: [string, "null"], description: A frontend path to open, e.g. `/practice/result/7`. }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      example:
        notificationId: 3
        type: course.approved
        title: "Your course \"Band 5 Foundations\" was approved"
        body: null
        link: /instructor/courses/1
        readAt: null
        createdAt: "2026-11-24T08:00:00.000Z"

    # ----- Reports -----
    ReportTargetType:
      type: string
      enum: [comment, lesson, question]
    ReportStatus:
      type: string
      enum: [open, resolved, dismissed]
    ReportInput:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { $ref: "#/components/schemas/ReportTargetType" }
        targetId: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    ReportUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [resolved, dismissed] }
        note: { type: string, maxLength: 1000, description: Shown to the reporter. }
        removeComment: { type: boolean, description: "Only for a comment report that is resolved." }
    Report:
      type: object
      required: [reportId, reporter, targetType, targetId, target, reason, status, note, handledBy, handledAt, createdAt]
      properties:
        reportId: { type: integer }
        reporter:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        targetType: { $ref: "#/components/schemas/ReportTargetType" }
        targetId: { type: integer }
        target:
          type: object
          description: What the report points at, for the moderation table.
          required: [preview, lessonId, courseId, removed]
          properties:
            preview: { type: [string, "null"], description: "The comment text, lesson title or question text (shortened). Null if gone." }
            lessonId: { type: [integer, "null"] }
            courseId: { type: [integer, "null"] }
            removed: { type: boolean, description: The target no longer exists or was removed. }
        reason: { type: string }
        status: { $ref: "#/components/schemas/ReportStatus" }
        note: { type: [string, "null"] }
        handledBy:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        handledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
