name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieltstudy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ieltstudy_test
      BLANK_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ieltstudy_blank
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The Docker image only has backend/, so it reads its own copy of the fitted parameters
      - name: Check the BKT parameter copies match
        run: cmp ../ml/output/bkt_params.json src/config/bkt-params.json
      - run: npm run typecheck
      - run: npm run lint
      # Every migration must apply to an empty database, and the seed must run on the result
      - name: Migrate a blank database and seed it
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ieltstudy_blank"
          npx prisma db migrate --db "$BLANK_DATABASE_URL" --yes --quiet > /dev/null
          DATABASE_URL="$BLANK_DATABASE_URL" SEED_PASSWORD=ci-seed-password npm run seed
      - run: npm test
      # The simulated evaluation (Phase 6): hybrid vs sequential vs popularity
      - run: npm run eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    # The browsers ship inside this image, so the job never downloads them: the Playwright
    # CDN stalled at 100% on every attempt from these runners. Bump the tag together with
    # the frontend's playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieltstudy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # From inside a job container a service answers to its own name, not to localhost
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ieltstudy
      JWT_SECRET: ci-e2e-secret
      SEED_PASSWORD: ci-seed-password
      BACKEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Migrate and seed
        working-directory: backend
        run: |
          npx prisma db migrate --db "$DATABASE_URL" --yes --quiet > /dev/null
          npm run seed
      - name: Run the end-to-end tests
        run: |
          (cd backend && PORT=3000 node src/server.ts > /tmp/backend.log 2>&1 &)
          npx --yes wait-on@8 --timeout 60000 http-get://localhost:3000/
          cd frontend && npm run test:e2e
      - name: Show the server logs
        if: failure()
        run: |
          echo "=== backend ==="
          cat /tmp/backend.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ieltstudy-backend backend
